services:
  db:
    image: postgres:15
    restart: always
    env_file: ./backend/.env.db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env.backend

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"

volumes:
  postgres_data: